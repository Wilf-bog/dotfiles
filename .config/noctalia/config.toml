[bar.default]
background_opacity = 0.8
end = [
    "tray",
    "notifications",
    "clipboard",
    "keyboard_layout",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
start = [ "launcher", "wallpaper", "screenshot", "workspaces", "media" ]

[brightness]
enable_ddcutil = true
ignore_mmids = []
minimum_brightness = 0.0
sync_all_monitors = false

[dock]
enabled = true
pinned = [ "org.gnome.Nautilus", "emacs" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
auto_locate = true

[nightlight]
enabled = true

[shell]
app_icon_color = "secondary"
font_family = "Aporetic Sans"
polkit_agent = true
screen_time_enabled = true
umbriel_audio_provider_enabled = true

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    annotate = true
    copy_on_close = true

[theme]
community_palette = "Gruvbox Material"
mode = "auto"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "umbriel" ]
    community_ids = [ "discord", "telegram" ]

[widget.network]
show_label = false
